services:
  - type: web
    name: text-to-speech
    env: python
    buildCommand: uv sync --frozen
    startCommand: uv run --frozen gunicorn --threads 4 --timeout 120 app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: INWORLD_API_KEY
        sync: false
    disk:
      name: saves-data
      mountPath: /opt/render/project/src/saves
      sizeGB: 1
